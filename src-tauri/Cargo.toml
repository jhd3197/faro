[package]
name = "faro"
version = "0.4.0"
edition = "2021"
description = "Faro — a modern FTP, SFTP, SSH, and S3 client for developers."
authors = ["Juan Denis"]
license = "MIT"

[lib]
name = "faro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# SSH / SFTP
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2.0"

# FTP / FTPS — sync API, driven from tokio via spawn_blocking.
suppaftp = { version = "6", features = ["native-tls"] }

# Misc
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
sha2 = "0.10"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
