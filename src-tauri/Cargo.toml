[package]
name = "faro"
version = "1.3.12"
edition = "2021"
description = "Faro — a modern FTP, SFTP, SSH, and S3 client for developers."
authors = ["Juan Denis"]
license = "MIT"
# This package builds the Faro GUI only (`src/main.rs` → the `faro` binary).
# The standalone CLI lives in its own workspace member, `faro-cli/`, so the
# Tauri bundler only ever sees ONE binary in this package. A second `[[bin]]`
# here breaks the macOS `universal-apple-darwin` bundle: Tauri lipo's only the
# main binary into the universal target dir, then the bundler fails trying to
# copy the un-lipo'd second binary into Faro.app.
[workspace]
members = ["faro-cli", "faro-agent-proto", "faro-agentd"]
resolver = "2"

[lib]
name = "faro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
# Native file/folder picker for the Upload button + download-folder chooser.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# SSH / SFTP
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2.0"

# Faro Agent (Faro-to-Faro remote control) — shared wire protocol + encrypted
# channel. mdns-sd powers LAN discovery of paired daemons.
faro-agent-proto = { path = "faro-agent-proto" }
mdns-sd = "0.11"

# FTP / FTPS — sync API, driven from tokio via spawn_blocking.
suppaftp = { version = "6", features = ["native-tls"] }

# S3 / R2 / B2 — Apache Arrow's polymorphic object_store crate. v0.6 will reuse
# this with the `azure` feature for Azure Blob.
object_store = { version = "0.11", features = ["aws", "azure"] }
bytes = "1"

# Importers — quick-xml for FileZilla's sitemanager.xml.
quick-xml = "0.36"

# Misc
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }

# Filesystem watcher — powers the right-click "Edit with…" flow that
# downloads a remote file to a tempfile, opens it in the user's editor, and
# uploads it back on every save.
notify = "6"

# Windows-only: registry access for the PuTTY sessions importer.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
